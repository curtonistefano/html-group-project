<html>
    <head>
        <title>CheckNews</title>
        <link rel="stylesheet" href="global.css">
        <script src="main.js"></script>
        <!-- il font può essere importato solo sull'index perchè il browser lo trova nella cache per le altre pagine-->
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="media/favicon.svg">
    </head>
    <body>
        <div class="glass-box floating" style="position: fixed; left: 8px; right: 8px; height: 30px; display: flex; justify-content: space-between; "> 
            <div style="display: flex; padding: 3px; gap: 10px;"> 
                <button id="login-button" style="background-color: rgba(0, 0, 0, 0); border:none; display:flex; padding:0px;"> <!--padding 0 overrides chrome default 6 and 1 px padding for buttons-->
                    <img src="media/login-button.svg">
                </button>
                <a href="subscribe.html" style="display: flex; min-width: 0px;">
                    <img src="media/signin-button.svg">
                </a>
            </div>
            <div style="display: flex; padding: 3px; gap: 10px;"> 
                <a href="report.html" style="display: flex; min-width: 0px;">
                    <img src="media/table.svg">
                </a>
                <a href="https://github.com/curtonistefano/html-group-project" style="display: flex; min-width: 0px;">
                    <img src="https://cdn.simpleicons.org/github">
                </a>
            </div>
        </div>

        <div style="display: flex; justify-content: center;padding-top: 41px"> <!--padding-top = 3px(approx borders+shadows) + 8px + ((2 * padding + height)of the top bar-->
            <div class="glass-box">
                <h1 style="font-size: 60px; margin: 20px">CheckNews</h1>
            </div>
        </div>

        <!--<img src="https://images.pexels.com/photos/10004971/pexels-photo-10004971.jpeg">-->
        <div id="login-box" class="glass-box floating hidden" style="top:49px; left:28px;">
            <p>Login</p>
            <form>
                <div style="display: flex; flex-direction: column;">
                    <input class="glass-box glass-input" type="email" placeholder="Email" required>
                    <input class="glass-box glass-input" placeholder="Password" required>
                    <button class="glass-box glass-input" id="form-login-button" type="submit">Login</button>
                </div>
            </form>
        </div>
        <div class="main-card-box">
            <a href="about_fake.html" class="glass-box main-card" style=" color:black; text-decoration: none;"> <!-- stile rimuove il testo blu sottolineato tipico dei link-->
                <h1>
                    Tu e le fake news
                </h1>
                <div style="display:flex; flex:1;">
                    <img src="media/book.svg">
                </div>
            </a>
            <a href="description.html" class="glass-box main-card" style=" color:black; text-decoration: none;"> 
                <h1>
                    Questo sito
                </h1>
                <div style="display:flex; flex:1;">
                    <img src="media/gear.svg">
                </div>
            </a>
            <a href="lista.html" class="glass-box main-card" style=" color:black; text-decoration: none;"> 
                <h1>
                    Lista Fake News
                </h1>
                <div style="display:flex; flex:1;">
                    <img src="media/binoculars.svg">
                </div>
            </a>
        </div>
    </body>
</html>
